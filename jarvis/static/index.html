<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #000814;
      --cyan:      #00b4d8;
      --cyan-dim:  #0077a8;
      --cyan-pale: #90e0ef;
      --cyan-glow: #caf0f8;
      --text:      #caf0f8;
      --grid:      rgba(0, 180, 216, 0.06);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
    }

    /* ── Background Grid + Scanlines ───────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.08) 3px,
        rgba(0, 0, 0, 0.08) 4px
      );
    }

    /* ── Layout ─────────────────────────────────────────────── */
    #app {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid rgba(0, 180, 216, 0.2);
      background: rgba(0, 8, 20, 0.7);
      backdrop-filter: blur(4px);
    }
    .hdr-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem; font-weight: 900; letter-spacing: 0.35em;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan), 0 0 30px rgba(0,180,216,0.4);
    }
    .hdr-right {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.72rem; letter-spacing: 0.08em; color: var(--cyan-pale);
    }
    #status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #555; transition: background 0.5s, box-shadow 0.5s;
    }
    #status-dot.online { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    #status-dot.error  { background: #e63946;     box-shadow: 0 0 8px #e63946; }

    /* ── Main (orb area) ────────────────────────────────────── */
    main {
      flex: 1 1 auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      overflow: hidden;
      padding: 10px;
    }

    /* ── Orb ────────────────────────────────────────────────── */
    .orb-wrap {
      position: relative;
      width: 280px; height: 280px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .orb {
      width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%,
        #0d2b45 0%, #020f1e 55%, #000814 100%);
      border: 1.5px solid rgba(0, 180, 216, 0.3);
      box-shadow:
        0 0 30px rgba(0,180,216,0.15),
        inset 0 0 40px rgba(0,0,0,0.8);
      transition: box-shadow 0.5s, border-color 0.5s;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    #waveform {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
    }

    .orb-label {
      position: relative; z-index: 2;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem; font-weight: 700; letter-spacing: 0.2em;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan), 0 0 35px rgba(0,180,216,0.5);
      user-select: none;
      transition: opacity 0.3s;
    }

    /* Spinner for thinking */
    .spinner {
      position: absolute;
      inset: -6px; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--cyan);
      border-right-color: var(--cyan);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Rings */
    .ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(0, 180, 216, 0.35);
      pointer-events: none; opacity: 0;
      transition: border-color 0.4s;
    }
    .ring-1 { inset: -20px; }
    .ring-2 { inset: -40px; }
    .ring-3 { inset: -62px; }

    /* ── State: idle ────────────────────────────────────────── */
    @keyframes idle-pulse {
      0%, 100% { box-shadow: 0 0 25px rgba(0,180,216,0.12), inset 0 0 40px rgba(0,0,0,0.8); }
      50%       { box-shadow: 0 0 45px rgba(0,180,216,0.22), inset 0 0 40px rgba(0,0,0,0.8); }
    }
    .orb-wrap.idle .orb { animation: idle-pulse 3s ease-in-out infinite; }

    /* ── State: listening ───────────────────────────────────── */
    @keyframes ring-expand {
      0%   { transform: scale(1);    opacity: 0.6; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .orb-wrap.listening .orb {
      border-color: var(--cyan);
      box-shadow:
        0 0 55px rgba(0,180,216,0.45),
        0 0 100px rgba(0,180,216,0.15),
        inset 0 0 40px rgba(0,0,0,0.6);
    }
    .orb-wrap.listening .ring-1 {
      opacity: 1; border-color: rgba(0,180,216,0.5);
      animation: ring-expand 1.5s ease-out infinite;
    }
    .orb-wrap.listening .ring-2 {
      opacity: 1; border-color: rgba(0,180,216,0.35);
      animation: ring-expand 1.5s ease-out 0.5s infinite;
    }
    .orb-wrap.listening .ring-3 {
      opacity: 1; border-color: rgba(0,180,216,0.2);
      animation: ring-expand 1.5s ease-out 1s infinite;
    }

    /* ── State: thinking ────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .orb-wrap.thinking .orb {
      border-color: rgba(0,180,216,0.5);
      box-shadow:
        0 0 40px rgba(0,180,216,0.25),
        inset 0 0 40px rgba(0,0,0,0.7);
    }
    .orb-wrap.thinking .spinner {
      opacity: 1;
      animation: spin 1s linear infinite;
    }

    /* ── State: speaking ────────────────────────────────────── */
    @keyframes speak-pulse {
      0%, 100% { box-shadow: 0 0 55px rgba(0,180,216,0.4), 0 0 110px rgba(0,180,216,0.1), inset 0 0 40px rgba(0,0,0,0.6); }
      50%       { box-shadow: 0 0 80px rgba(0,180,216,0.65), 0 0 150px rgba(0,180,216,0.2), inset 0 0 40px rgba(0,0,0,0.6); }
    }
    @keyframes ring-slow {
      0%   { transform: scale(1);    opacity: 0.45; }
      100% { transform: scale(1.12); opacity: 0; }
    }
    .orb-wrap.speaking .orb {
      border-color: var(--cyan);
      animation: speak-pulse 1.8s ease-in-out infinite;
    }
    .orb-wrap.speaking .ring-1 {
      opacity: 1; animation: ring-slow 2.2s ease-out infinite;
    }
    .orb-wrap.speaking .ring-2 {
      opacity: 1; animation: ring-slow 2.2s ease-out 0.7s infinite;
    }
    .orb-wrap.speaking .ring-3 {
      opacity: 1; animation: ring-slow 2.2s ease-out 1.4s infinite;
    }

    /* ── Status / Interim text ──────────────────────────────── */
    #status-label {
      font-size: 0.75rem; letter-spacing: 0.12em;
      color: var(--cyan-dim); text-transform: uppercase;
      transition: color 0.4s; min-height: 1.2em; text-align: center;
    }
    #interim-text {
      font-size: 0.85rem; color: var(--cyan-pale);
      max-width: 480px; text-align: center;
      min-height: 1.4em; font-style: italic;
      opacity: 0.8; letter-spacing: 0.03em;
    }
    #hint-text {
      font-size: 0.68rem; color: rgba(144,224,239,0.35);
      letter-spacing: 0.1em; text-align: center;
    }

    /* ── Transcript ─────────────────────────────────────────── */
    #transcript-wrap {
      flex: 0 0 auto;
      height: 30vh; min-height: 120px; max-height: 280px;
      border-top: 1px solid rgba(0,180,216,0.15);
      background: rgba(0,8,20,0.6);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column;
    }
    #transcript-header {
      flex: 0 0 auto;
      padding: 6px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.2em;
      color: rgba(0,180,216,0.4);
      border-bottom: 1px solid rgba(0,180,216,0.08);
    }
    #transcript {
      flex: 1 1 auto;
      overflow-y: auto; overflow-x: hidden;
      padding: 8px 20px 12px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    #transcript::-webkit-scrollbar { width: 4px; }
    #transcript::-webkit-scrollbar-track { background: transparent; }
    #transcript::-webkit-scrollbar-thumb { background: rgba(0,180,216,0.25); border-radius: 2px; }

    .transcript-entry { display: flex; flex-direction: column; gap: 3px; }

    .transcript-entry .role {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.2em; font-weight: 700;
    }
    .transcript-entry.user .role  { color: var(--cyan-pale); }
    .transcript-entry.jarvis .role {
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,180,216,0.5);
    }

    .transcript-entry .msg {
      font-size: 0.82rem; line-height: 1.55;
      color: rgba(202,240,248,0.65); letter-spacing: 0.01em;
    }
    .transcript-entry.jarvis .msg.streaming { color: var(--cyan-pale); }
    .transcript-entry.jarvis .msg           { color: var(--cyan-glow); }
    .transcript-entry.user  .msg            { color: rgba(202,240,248,0.55); }

    /* ── Text input bar ─────────────────────────────────────── */
    #input-row {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 0;
      border-top: 1px solid rgba(0,180,216,0.12);
      background: rgba(0,4,12,0.8);
    }
    #text-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--cyan-glow); font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem; padding: 10px 16px;
      caret-color: var(--cyan);
    }
    #text-input::placeholder { color: rgba(0,180,216,0.3); }
    #send-btn {
      background: none; border: none; cursor: pointer;
      padding: 10px 18px; color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.15em;
      transition: color 0.2s, text-shadow 0.2s;
    }
    #send-btn:hover {
      color: #fff;
      text-shadow: 0 0 8px var(--cyan);
    }

    /* ── Boot overlay ───────────────────────────────────────── */
    #boot-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #000814;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
    }
    #boot-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem; font-weight: 900; letter-spacing: 0.4em;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan), 0 0 60px rgba(0,180,216,0.5);
    }
    #boot-bar-wrap {
      width: 340px; height: 3px;
      background: rgba(0,180,216,0.12);
      border-radius: 2px; overflow: hidden;
    }
    #boot-bar {
      height: 100%; width: 0%; background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      border-radius: 2px;
      transition: width 0.28s linear;
    }
    #boot-messages {
      height: 26px;
      font-size: 0.72rem; letter-spacing: 0.12em;
      color: var(--cyan-pale); text-transform: uppercase;
      display: flex; align-items: center; justify-content: center;
    }
    #boot-overlay.fade-out {
      animation: fadeOut 0.6s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>

<!-- Boot overlay -->
<div id="boot-overlay">
  <div id="boot-title">J.A.R.V.I.S.</div>
  <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
  <div id="boot-messages">Initialising...</div>
</div>

<!-- Main app -->
<div id="app">
  <header>
    <div class="hdr-title">J.A.R.V.I.S.</div>
    <div class="hdr-right">
      <span id="status-label-hdr">OFFLINE</span>
      <div id="status-dot"></div>
    </div>
  </header>

  <main>
    <div class="orb-wrap idle" id="orb-wrap" title="Click or press Space to speak">
      <div class="orb" id="orb">
        <canvas id="waveform" width="280" height="280"></canvas>
        <div class="orb-label" id="orb-label">AI</div>
      </div>
      <div class="spinner"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>

    <div id="status-label">IDLE — CLICK ORB OR PRESS SPACE TO SPEAK</div>
    <div id="interim-text"></div>
    <div id="hint-text">SPACE = push to talk &nbsp;·&nbsp; ESC = stop &nbsp;·&nbsp; ENTER = type</div>
  </main>

  <div id="transcript-wrap">
    <div id="transcript-header">COMMUNICATION LOG</div>
    <div id="transcript"></div>
    <div id="input-row">
      <input id="text-input" type="text" placeholder="Type a message... (or click the orb to speak)" autocomplete="off" />
      <button id="send-btn">SEND</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   J.A.R.V.I.S.  —  Frontend script
   ════════════════════════════════════════════════════════ */

/* ── 1. Boot Sequence ─────────────────────────────────── */
(function runBoot() {
  const MESSAGES = [
    "LOADING NEURAL ARCHITECTURE...",
    "CALIBRATING SARCASM MODULES...",
    "IMPORTING BRITISH DISDAIN...",
    "COMPILING CONDESCENSION ENGINE...",
    "ESTABLISHING CLAUDE LINK...",
    "SUPPRESSING ENTHUSIASM...",
    "SYSTEM READY."
  ];

  const overlay  = document.getElementById('boot-overlay');
  const bar      = document.getElementById('boot-bar');
  const msgEl    = document.getElementById('boot-messages');
  let   idx      = 0;

  function step() {
    if (idx >= MESSAGES.length) {
      overlay.classList.add('fade-out');
      overlay.addEventListener('animationend', () => overlay.remove(), { once: true });
      return;
    }
    msgEl.textContent = MESSAGES[idx];
    bar.style.width   = Math.round(((idx + 1) / MESSAGES.length) * 100) + '%';
    idx++;
    setTimeout(step, idx === MESSAGES.length ? 500 : 300);
  }
  setTimeout(step, 200);
})();

/* ── 2. State Machine ─────────────────────────────────── */
const STATES = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking' };
let currentState = STATES.IDLE;

const orbWrap    = document.getElementById('orb-wrap');
const statusLbl  = document.getElementById('status-label');
const statusHdr  = document.getElementById('status-label-hdr');
const interimEl  = document.getElementById('interim-text');
const orbLabel   = document.getElementById('orb-label');
const statusDot  = document.getElementById('status-dot');

const STATE_LABELS = {
  idle:      'IDLE — CLICK ORB OR PRESS SPACE TO SPEAK',
  listening: 'LISTENING...',
  thinking:  'PROCESSING REQUEST...',
  speaking:  'JARVIS IS SPEAKING...'
};

function setState(s) {
  currentState = s;
  orbWrap.className = 'orb-wrap ' + s;
  statusLbl.textContent = STATE_LABELS[s] || s.toUpperCase();
  if (s !== STATES.LISTENING) interimEl.textContent = '';
}

/* ── 3. WebSocket ─────────────────────────────────────── */
let ws = null;
let wsConnected = false;
let reconnectTimer = null;

function connectWS() {
  if (ws && ws.readyState <= WebSocket.OPEN) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    wsConnected = true;
    statusDot.className = 'online';
    statusHdr.textContent = 'ONLINE';
    console.log('[WS] Connected');
  };

  ws.onclose = () => {
    wsConnected = false;
    statusDot.className = 'error';
    statusHdr.textContent = 'RECONNECTING';
    setState(STATES.IDLE);
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = (e) => {
    console.warn('[WS] Error', e);
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  };
}

function sendToJarvis(text) {
  if (!text.trim()) return;
  if (!wsConnected) {
    addTranscriptEntry('jarvis', 'Connection offline — trying to reconnect...');
    connectWS();
    return;
  }
  addTranscriptEntry('user', text);
  currentJarvisEntry = null;
  setState(STATES.THINKING);
  ws.send(JSON.stringify({ type: 'chat', text }));
}

/* ── 4. Message Handler ───────────────────────────────── */
let currentJarvisEntry = null;   // live streaming DOM element

function handleMessage(msg) {
  switch (msg.type) {
    case 'token':
      if (!currentJarvisEntry) {
        currentJarvisEntry = addTranscriptEntry('jarvis', '', true);
      }
      currentJarvisEntry.textContent += msg.text;
      scrollTranscript();
      break;

    case 'done':
      if (currentJarvisEntry) {
        currentJarvisEntry.classList.remove('streaming');
      }
      break;

    case 'audio':
      setState(STATES.SPEAKING);
      playBase64Audio(msg.data);
      break;

    case 'speak':
      setState(STATES.SPEAKING);
      browserSpeak(msg.text);
      break;

    case 'error':
      addTranscriptEntry('jarvis', '[Error: ' + msg.text + ']');
      setState(STATES.IDLE);
      break;
  }
}

/* ── 5. Transcript Helpers ────────────────────────────── */
const transcriptEl = document.getElementById('transcript');

function addTranscriptEntry(role, text, streaming = false) {
  const entry = document.createElement('div');
  entry.className = 'transcript-entry ' + role;

  const roleEl = document.createElement('div');
  roleEl.className = 'role';
  roleEl.textContent = role === 'user' ? 'YOU' : 'J.A.R.V.I.S.';

  const msgEl = document.createElement('div');
  msgEl.className = 'msg' + (streaming ? ' streaming' : '');
  msgEl.textContent = text;

  entry.appendChild(roleEl);
  entry.appendChild(msgEl);
  transcriptEl.appendChild(entry);
  scrollTranscript();

  return msgEl;
}

function scrollTranscript() {
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* ── 6. Audio Playback ────────────────────────────────── */
function playBase64Audio(b64) {
  const audio = new Audio('data:audio/mp3;base64,' + b64);
  audio.onended  = () => setState(STATES.IDLE);
  audio.onerror  = () => setState(STATES.IDLE);
  audio.play().catch(() => setState(STATES.IDLE));
}

/* ── 7. Browser TTS ───────────────────────────────────── */
let ttsVoice = null;

function loadTTSVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;

  // Priority: Daniel (macOS) → Google UK English Male → en-GB → en-*
  ttsVoice =
    voices.find(v => v.name === 'Daniel') ||
    voices.find(v => v.name === 'Google UK English Male') ||
    voices.find(v => v.lang === 'en-GB') ||
    voices.find(v => v.lang.startsWith('en-')) ||
    null;
}

if (typeof speechSynthesis !== 'undefined') {
  loadTTSVoice();
  speechSynthesis.onvoiceschanged = loadTTSVoice;
}

function browserSpeak(text) {
  if (typeof speechSynthesis === 'undefined') {
    setState(STATES.IDLE);
    return;
  }
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  if (ttsVoice) utt.voice = ttsVoice;
  utt.lang  = 'en-GB';
  utt.rate  = 1.08;
  utt.pitch = 0.92;
  utt.onend   = () => setState(STATES.IDLE);
  utt.onerror = () => setState(STATES.IDLE);
  speechSynthesis.speak(utt);
}

/* ── 8. Speech Recognition ────────────────────────────── */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition     = null;
let recognitionOn   = false;
let micStream       = null;
let audioCtx        = null;
let analyser        = null;
let micSource       = null;
let rafId           = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    interimEl.textContent = interim || final;
    if (final) {
      stopListening();
      sendToJarvis(final);
    }
  };

  recognition.onerror = (e) => {
    console.warn('[STT]', e.error);
    if (e.error === 'not-allowed') {
      statusLbl.textContent = 'MIC ACCESS DENIED — CHECK BROWSER SETTINGS';
    } else if (e.error !== 'aborted' && e.error !== 'no-speech') {
      statusLbl.textContent = 'SPEECH RECOGNITION UNAVAILABLE: ' + e.error.toUpperCase();
    }
    stopListening(true);
  };

  recognition.onend = () => {
    if (recognitionOn) {
      // was still on — restart if needed (e.g. no speech timeout)
      recognitionOn = false;
      if (currentState === STATES.LISTENING) setState(STATES.IDLE);
    }
  };
} else {
  statusLbl.textContent = 'SPEECH API UNAVAILABLE — USE TEXT INPUT BELOW';
}

function startListening() {
  if (currentState !== STATES.IDLE) return;
  if (!recognition) { statusLbl.textContent = 'SPEECH API UNAVAILABLE — USE TEXT INPUT'; return; }

  setState(STATES.LISTENING);
  interimEl.textContent = '';

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      micStream = stream;
      setupAudioVisualiser(stream);
      try {
        recognition.start();
        recognitionOn = true;
      } catch(e) {
        console.warn('[STT start]', e);
      }
    })
    .catch(err => {
      console.warn('[Mic]', err);
      statusLbl.textContent = 'MIC ACCESS DENIED';
      setState(STATES.IDLE);
    });
}

function stopListening(silent = false) {
  recognitionOn = false;
  try { recognition && recognition.stop(); } catch {}
  stopMic();
  if (!silent && currentState === STATES.LISTENING) setState(STATES.IDLE);
}

function stopMic() {
  cancelAnimationFrame(rafId);
  clearWaveform();
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (micSource) { try { micSource.disconnect(); } catch {} micSource = null; }
  if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
  analyser = null;
}

/* ── 9. Audio Visualiser ──────────────────────────────── */
const canvas  = document.getElementById('waveform');
const canvasCtx = canvas.getContext('2d');

function setupAudioVisualiser(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.8;
  micSource = audioCtx.createMediaStreamSource(stream);
  micSource.connect(analyser);
  drawWaveform();
}

function drawWaveform() {
  rafId = requestAnimationFrame(drawWaveform);

  if (currentState !== STATES.LISTENING) {
    clearWaveform();
    return;
  }

  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);

  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const baseR = 70;

  canvasCtx.clearRect(0, 0, W, H);

  const len = buf.length;
  canvasCtx.beginPath();
  for (let i = 0; i < len; i++) {
    const angle = (i / len) * Math.PI * 2 - Math.PI / 2;
    const amp   = (buf[i] / 255) * 50;
    const r     = baseR + amp;
    const x     = cx + Math.cos(angle) * r;
    const y     = cy + Math.sin(angle) * r;
    if (i === 0) canvasCtx.moveTo(x, y);
    else         canvasCtx.lineTo(x, y);
  }
  canvasCtx.closePath();

  const grad = canvasCtx.createRadialGradient(cx, cy, baseR - 10, cx, cy, baseR + 55);
  grad.addColorStop(0, 'rgba(0,180,216,0.55)');
  grad.addColorStop(1, 'rgba(0,180,216,0)');
  canvasCtx.strokeStyle = 'rgba(0,180,216,0.85)';
  canvasCtx.lineWidth   = 1.5;
  canvasCtx.stroke();
  canvasCtx.fillStyle   = grad;
  canvasCtx.fill();
}

function clearWaveform() {
  canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ── 10. Orb Click ────────────────────────────────────── */
orbWrap.addEventListener('click', () => {
  if (currentState === STATES.IDLE)      startListening();
  else if (currentState === STATES.LISTENING) stopListening();
});

/* ── 11. Keyboard Shortcuts ───────────────────────────── */
document.addEventListener('keydown', (e) => {
  if (e.target === document.getElementById('text-input')) return;

  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    if (currentState === STATES.IDLE)           startListening();
    else if (currentState === STATES.LISTENING) stopListening();
  }
  if (e.code === 'Escape') {
    stopListening();
    speechSynthesis && speechSynthesis.cancel();
    setState(STATES.IDLE);
  }
});

/* ── 12. Text Input ───────────────────────────────────── */
const textInput = document.getElementById('text-input');
const sendBtn   = document.getElementById('send-btn');

function handleSendText() {
  const txt = textInput.value.trim();
  if (!txt) return;
  textInput.value = '';
  sendToJarvis(txt);
}

sendBtn.addEventListener('click', handleSendText);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); handleSendText(); }
});

/* ── 13. Boot & Connect ───────────────────────────────── */
connectWS();
</script>
